name: Monitorar pagamentos individuais PG Soft
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pgsoft-wins-collector
  cancel-in-progress: false
jobs:
  collect-wins:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Sincronizar com main
        run: git pull --rebase origin main
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache Chromium
        uses: actions/cache@v4
        id: chromium-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-v1
      - name: Instalar Playwright
        run: pip install playwright==1.55.0
      - name: Instalar Chromium
        if: steps.chromium-cache.outputs.cache-hit != 'true'
        run: python -m playwright install chromium
      - name: Testar parser de pagamentos
        run: python -m unittest scripts.test_wins -v
      - name: Coletar pagamentos individuais 50x+
        run: python scripts/collect_wins.py
      - name: Salvar diagnóstico e eventos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/wins.json
          if git diff --cached --quiet; then
            echo "Sem alterações nos pagamentos."
            exit 0
          fi
          git commit -m "Atualiza monitoramento de pagamentos PG Soft"
          git pull --rebase origin main
          git push origin HEAD:main
