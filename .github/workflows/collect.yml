name: Coletar dados públicos PG Soft
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/collect.yml"
      - "scripts/collect.py"
      - "scripts/test_collect.py"
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pgsoft-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testar parsers
        run: python -m unittest scripts.test_collect -v
      - name: Coletar acumulados publicados
        run: python scripts/collect.py
      - name: Salvar histórico
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json data/latest.json
          git diff --cached --quiet || (git commit -m "Atualiza histórico público PG Soft" && git push)
