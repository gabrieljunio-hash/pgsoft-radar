name: Coletar dados públicos PG Soft
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/collect.yml"
      - "scripts/collect.py"
      - "scripts/test_collect.py"
      - "scripts/check_images.py"
      - "scripts/collect_wins.py"
      - "scripts/test_wins.py"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pgsoft-collector-v2
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Sincronizar com main
        run: git pull --rebase origin main
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache Chromium
        uses: actions/cache@v4
        id: chromium-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-v1
      - name: Instalar Playwright
        run: pip install playwright==1.55.0
      - name: Instalar Chromium
        if: steps.chromium-cache.outputs.cache-hit != 'true'
        run: python -m playwright install chromium
      - name: Testar parsers
        run: python -m unittest scripts.test_collect scripts.test_wins -v
      - name: Validar JavaScript do painel
        run: node --check app.js
      - name: Coletar acumulados publicados
        run: python scripts/collect.py
      - name: Verificar URLs reais das capas
        run: python scripts/check_images.py
      - name: Coletar pagamentos individuais 50x+
        run: python scripts/collect_wins.py
      - name: Salvar histórico
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json data/latest.json data/wins.json
          if git diff --cached --quiet; then
            echo "Sem alterações nos dados."
            exit 0
          fi
          git commit -m "Atualiza histórico público PG Soft"
          git pull --rebase origin main
          git push origin HEAD:main
